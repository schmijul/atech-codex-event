name: slot-8-display
board: 14port
modules_path: ./my_modules
modules:
  - {id: st7735_tft, instance: display, ports: [13, 14]}
  - {id: speaker, instance: speaker, ports: [3, 4]}
  - {id: microphone, instance: microphone, ports: [5, 6]}
  - {id: button, instance: button, port: 9}
  - {id: button, instance: resetButton, port: 1}
code:
  setup: |
    display.setDirectMode(true);
    WiFi.mode(WIFI_STA);
  loop: |
    static bool medsTaken = false;
    static bool needsRedraw = true;
    static bool refreshed = false;
    static bool reminderStarted = false;
    static bool pendingApiPost = false;
    static bool wifiScanRunning = false;
    static int lastWifiStatus = -1;
    static unsigned long lastReminder = 0;
    static unsigned long lastApiAttempt = 0;
    static unsigned long lastWifiScan = 0;
    static bool voiceRecording = false;
    static unsigned long voiceLastSound = 0;
    static unsigned long voiceCooldown = 0;
    static String voiceApiUrl = "http://172.20.10.3:8001/api/voice";

    int wifiStatus = WiFi.status();
    if (wifiStatus != lastWifiStatus) {
      lastWifiStatus = wifiStatus;
      Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"wifi_status\",\"value\":%d}}\n", wifiStatus);
    }

    unsigned long now = millis();
    if (!wifiScanRunning && wifiStatus != WL_CONNECTED &&
        (lastWifiScan == 0 || now - lastWifiScan >= 10000UL)) {
      WiFi.scanNetworks(true, true);
      wifiScanRunning = true;
      lastWifiScan = now;
    }
    if (wifiScanRunning) {
      int networksFound = WiFi.scanComplete();
      if (networksFound >= 0) {
        String matchingSsid;
        for (int i = 0; i < networksFound; i++) {
          String visibleSsid = WiFi.SSID(i);
          if (visibleSsid.equalsIgnoreCase(WIFI_SSID)) {
            matchingSsid = visibleSsid;
            break;
          }
        }
        Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"wifi_scan\",\"value\":{\"networks\":%d,\"target_visible\":%s}}}\n",
          networksFound, matchingSsid.length() ? "true" : "false");
        WiFi.scanDelete();
        wifiScanRunning = false;
        if (matchingSsid.length()) WiFi.begin(matchingSsid.c_str(), WIFI_PASSWORD);
      } else if (networksFound == -2) {
        wifiScanRunning = false;
      }
    }

    if (button.wasPressed() && !medsTaken) {
      medsTaken = true;
      speaker.stop();
      needsRedraw = true;
      pendingApiPost = true;
      Serial.println("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"meds_button\",\"value\":true}}");
    }

    if (resetButton.wasPressed()) {
      medsTaken = false;
      speaker.stop();
      needsRedraw = true;
      reminderStarted = false;
      lastReminder = 0;
      Serial.println("{\"type\":\"event\",\"payload\":{\"event_type\":\"state\",\"key\":\"meds_reminder_reset\",\"value\":true}}");
    }

    if (pendingApiPost && wifiStatus == WL_CONNECTED && now - lastApiAttempt >= 5000UL) {
      lastApiAttempt = now;
      int apiStatus = postMedsTakenToApi();
      if (apiStatus == 201) {
        pendingApiPost = false;
        Serial.println("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"meds_api_saved\",\"value\":true}}");
      } else if (apiStatus == 503 || apiStatus == -1000) {
        // The server says it could not save, or the request did not start; retry later.
      } else if (apiStatus < 0) {
        // No response is ambiguous: the server may have saved it before the timeout.
        // Do not retry; inspect GET /api/events before any manual retry.
        pendingApiPost = false;
        Serial.println("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"meds_api_uncertain\",\"value\":true}}");
      } else {
        pendingApiPost = false;
        Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"meds_api_rejected\",\"value\":%d}}\n", apiStatus);
      }
    }

    // Preserve the delayed refresh that worked with this display.
    if ((!refreshed && millis() > 2000) || atech_action == "display_refresh") {
      if (!refreshed) display.begin();
      display.setDirectMode(true);
      refreshed = true;
      needsRedraw = true;
      if (atech_action == "display_refresh") atechDone();
    }

    if (needsRedraw) {
      display.fillScreen(medsTaken ? ST7735_TFT::COLOR_GREEN : ST7735_TFT::COLOR_BLUE);
      if (medsTaken) {
        display.displayText("Meds taken", 20, 30, 2, ST7735_TFT::COLOR_BLACK);
      } else {
        display.displayText("Have you", 32, 8, 2, ST7735_TFT::COLOR_WHITE);
        display.displayText("taken your", 20, 28, 2, ST7735_TFT::COLOR_WHITE);
        display.displayText("meds?", 50, 48, 2, ST7735_TFT::COLOR_YELLOW);
        display.displayText("Press button when taken", 11, 70, 1, ST7735_TFT::COLOR_WHITE);
      }
      needsRedraw = false;
    }

    // Spoken reminder repeats until acknowledged.
    if (refreshed && !medsTaken && (!reminderStarted || now - lastReminder >= 30000UL)) {
      static const char elevenLabsSpeech[] =
        ""
        ""
        ""
        ""
        ""
        ""
        ""
        "";
      #if 0  // Superseded by the ElevenLabs clip above.
      static const char reminderSpeech[] =
        ""
        ""
        ""
        ""
        "AQAAAAAAAAAAAAAAAAAAAA==";
      #endif
      static int16_t decodedSpeech[18576];
      static const int stepTable[] = {7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45, 50, 55, 60, 66, 73, 80, 88, 97, 107, 118, 130, 143, 157, 173, 190, 209, 230, 253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658, 724, 796, 876, 963, 1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327, 3660, 4026, 4429, 4871, 5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899, 15289, 16818, 18500, 20350, 22385, 24623, 27086, 29794, 32767};
      static const int indexTable[] = {-1, -1, -1, -1, 2, 4, 6, 8, -1, -1, -1, -1, 2, 4, 6, 8};
      int predictor = 1;
      int index = 0;
      int sample = 0;
      for (int i = 0; elevenLabsSpeech[i] && sample < 18576; i += 4) {
        uint32_t packed = 0;
        for (int j = 0; j < 4; j++) {
          char c = elevenLabsSpeech[i + j];
          int value = c >= 'A' && c <= 'Z' ? c - 'A' : c >= 'a' && c <= 'z' ? c - 'a' + 26 : c >= '0' && c <= '9' ? c - '0' + 52 : c == '+' ? 62 : c == '/' ? 63 : 0;
          packed = (packed << 6) | value;
        }
        for (int byte = 2; byte >= 0 && sample < 18576; byte--) {
          uint8_t encoded = (packed >> (byte * 8)) & 0xFF;
          for (int half = 0; half < 2 && sample < 18576; half++) {
            int code = half ? encoded >> 4 : encoded & 0x0F;
            int step = stepTable[index];
            int delta = step >> 3;
            if (code & 4) delta += step;
            if (code & 2) delta += step >> 1;
            if (code & 1) delta += step >> 2;
            predictor += code & 8 ? -delta : delta;
            predictor = constrain(predictor, -32768, 32767);
            index = constrain(index + indexTable[code], 0, 88);
            decodedSpeech[sample++] = predictor;
            decodedSpeech[sample++] = predictor;
          }
        }
      }
      speaker.writeSamples(decodedSpeech, sample);
      voiceCooldown = millis();
      lastReminder = now;
      reminderStarted = true;
      Serial.println("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"meds_reminder\",\"value\":\"Have you taken your meds?\"}}");
    }

    if (atech_action == "display_status") {
      Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"state\",\"key\":\"display_text\",\"value\":\"%s\"}}\n", medsTaken ? "Meds taken" : "Have you taken your meds?");
      atechDone();
    }

    // Hands-free short utterances: begin on speech level, then stop after quiet.
    if (atech_action == "voice_host") {
      voiceApiUrl = "http://" + atech_value + ":8001/api/voice";
      atechDone();
    }
    unsigned long voiceNow = millis();
    int16_t voiceLevel = microphone.getSoundLevel();
    if (!voiceRecording && wifiStatus == WL_CONNECTED &&
        voiceNow - voiceCooldown >= 8000UL && voiceLevel >= 400 && !speaker.isPlaying()) {
      microphone.startRecording();
      voiceRecording = microphone.isRecording();
      voiceLastSound = voiceNow;
      if (voiceRecording) Serial.println("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"voice_listening\",\"value\":true}}");
    }
    if (voiceRecording) {
      if (voiceLevel >= 400) voiceLastSound = voiceNow;
      if (!microphone.isRecording() || voiceNow - voiceLastSound >= 900UL) {
        microphone.stopRecording();
        voiceRecording = false;
        voiceCooldown = voiceNow;
        int sampleCount = microphone.getRecordingLength();
        if (sampleCount >= 12000) {
          const int16_t* audio = microphone.getRecording();
          WiFiClient voiceClient;
          HTTPClient voiceRequest;
          voiceRequest.setTimeout(60000);
          if (voiceRequest.begin(voiceClient, voiceApiUrl)) {
            voiceRequest.addHeader("Content-Type", "application/octet-stream");
            int voiceStatus = voiceRequest.POST((uint8_t*)audio, sampleCount * sizeof(int16_t));
            if (voiceStatus == 200) {
              WiFiClient* response = voiceRequest.getStreamPtr();
              int remaining = voiceRequest.getSize();
              int16_t speechChunk[256];
              speaker.stop();
              while (remaining >= 2 && response->connected()) {
                int requestedBytes = min((int)sizeof(speechChunk), remaining) & ~1;
                int receivedBytes = response->readBytes((char*)speechChunk, requestedBytes);
                if (receivedBytes <= 0) break;
                speaker.writeSamples(speechChunk, receivedBytes / sizeof(int16_t));
                remaining -= receivedBytes;
              }
              Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"voice_reply_played\",\"value\":%s}}\n", remaining < 2 ? "true" : "false");
            } else {
              Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"voice_api_status\",\"value\":%d}}\n", voiceStatus);
            }
            voiceRequest.end();
          }
        }
        voiceCooldown = millis();
      }
    }
