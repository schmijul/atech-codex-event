name: slot-8-display
board: 14port
modules_path: ./my_modules
modules:
  - {id: st7735_tft, instance: display, ports: [13, 14]}
  - {id: speaker, instance: speaker, ports: [3, 4]}
  - {id: button, instance: button, port: 9}
code:
  setup: |
    display.setDirectMode(true);
  loop: |
    static bool medsTaken = false;
    static bool needsRedraw = true;
    static bool refreshed = false;
    static bool reminderStarted = false;
    static unsigned long lastReminder = 0;

    if (button.wasPressed() && !medsTaken) {
      medsTaken = true;
      speaker.stop();
      needsRedraw = true;
      Serial.println("{\"type\":\"event\",\"payload\":{\"event_type\":\"state\",\"key\":\"meds_taken\",\"value\":true}}");
    }

    // Preserve the delayed refresh that worked with this display.
    if ((!refreshed && millis() > 2000) || atech_action == "display_refresh") {
      if (!refreshed) display.begin();
      display.setDirectMode(true);
      refreshed = true;
      needsRedraw = true;
      if (atech_action == "display_refresh") atechDone();
    }

    if (needsRedraw) {
      display.fillScreen(medsTaken ? ST7735_TFT::COLOR_GREEN : ST7735_TFT::COLOR_BLUE);
      if (medsTaken) {
        display.displayText("Meds taken", 20, 30, 2, ST7735_TFT::COLOR_BLACK);
      } else {
        display.displayText("Have you", 32, 8, 2, ST7735_TFT::COLOR_WHITE);
        display.displayText("taken your", 20, 28, 2, ST7735_TFT::COLOR_WHITE);
        display.displayText("meds?", 50, 48, 2, ST7735_TFT::COLOR_YELLOW);
        display.displayText("Press button when taken", 11, 70, 1, ST7735_TFT::COLOR_WHITE);
      }
      needsRedraw = false;
    }

    // A short chime repeats until acknowledged; audio runs in the background.
    unsigned long now = millis();
    if (refreshed && !medsTaken && (!reminderStarted || now - lastReminder >= 30000UL)) {
      speaker.playNote(NOTE_C5, 180);
      lastReminder = now;
      reminderStarted = true;
      Serial.println("{\"type\":\"event\",\"payload\":{\"event_type\":\"log\",\"key\":\"meds_reminder\",\"value\":\"Have you taken your meds?\"}}");
    }

    if (atech_action == "display_status") {
      Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"state\",\"key\":\"display_text\",\"value\":\"%s\"}}\n", medsTaken ? "Meds taken" : "Have you taken your meds?");
      atechDone();
    }
